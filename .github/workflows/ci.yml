name: CI

on:
  push:
    branches: [main, requests]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: server
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openamp-files:dev

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # main publishes the "dev" release. Any other branch publishes its own
      # release under its own app id, so both builds can be installed together.
      - name: Name the build
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "RELEASE_TAG=dev" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=Development build $GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            echo "OPENAMP_VARIANT=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=dev-$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=Test build $GITHUB_RUN_NUMBER of the $GITHUB_REF_NAME branch" >> "$GITHUB_ENV"
          fi
      - name: Restore the signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openamp.p12"
            echo "OPENAMP_KEYSTORE=$RUNNER_TEMP/openamp.p12" >> "$GITHUB_ENV"
          fi
      - run: gradle :app:assembleDebug
        working-directory: android
        env:
          OPENAMP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk openamp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: openamp-apk
          path: openamp.apk
      # One rolling pre-release per branch, replaced on every push.
      - name: Publish the release
        if: github.event_name == 'push' && env.OPENAMP_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" openamp.apk --prerelease --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "Built from ${GITHUB_SHA::7}. Every build of a branch is signed with the same key, so it installs over the previous one."
