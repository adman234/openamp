name: CI

on:
  push:
    branches: [main, requests]
  pull_request:
  # Lets a branch be rebuilt by hand, which makes its build the newest one.
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: server
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openamp-files:dev

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # main publishes the normal release, the one marked "Latest". Any other
      # branch publishes a pre-release. Both are the same app signed with the
      # same key, so either installs over the other as long as it is newer.
      - name: Name the build
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "RELEASE_TAG=v0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=OpenAmp 0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "RELEASE_PRE=false" >> "$GITHUB_ENV"
          else
            echo "OPENAMP_VARIANT=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v0.1.$GITHUB_RUN_NUMBER-$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=OpenAmp 0.1.$GITHUB_RUN_NUMBER, $GITHUB_REF_NAME test build" >> "$GITHUB_ENV"
            echo "RELEASE_PRE=true" >> "$GITHUB_ENV"
          fi
      - name: Restore the signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openamp.p12"
            echo "OPENAMP_KEYSTORE=$RUNNER_TEMP/openamp.p12" >> "$GITHUB_ENV"
          fi
      - run: gradle :app:assembleDebug
        working-directory: android
        env:
          OPENAMP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk openamp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: openamp-apk
          path: openamp.apk
      # Each build gets its own version tag. Older builds of the same kind are removed,
      # so there is always one normal release and at most one pre-release.
      - name: Publish the release
        if: github.event_name != 'pull_request' && env.OPENAMP_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_PRE" = "true" ]; then kind="--prerelease"; else kind="--latest"; fi
          gh release create "$RELEASE_TAG" openamp.apk $kind --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "Built from ${GITHUB_SHA::7} on the $GITHUB_REF_NAME branch."
          gh release list --limit 100 --json tagName,isPrerelease --jq ".[] | select(.isPrerelease == $RELEASE_PRE) | .tagName" | while read -r old; do
            if [ "$old" != "$RELEASE_TAG" ]; then gh release delete "$old" --cleanup-tag --yes || true; fi
          done
