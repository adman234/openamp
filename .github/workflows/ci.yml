name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: server
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openamp-files:dev

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore the signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openamp.p12"
            echo "OPENAMP_KEYSTORE=$RUNNER_TEMP/openamp.p12" >> "$GITHUB_ENV"
          fi
      - run: gradle :app:assembleDebug
        working-directory: android
        env:
          OPENAMP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk openamp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: openamp-apk
          path: openamp.apk
      # One rolling pre-release, replaced on every push to main.
      - name: Publish the dev release
        if: github.event_name == 'push' && env.OPENAMP_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev openamp.apk             --prerelease             --target "$GITHUB_SHA"             --title "Development build ${{ github.run_number }}"             --notes "Built from ${GITHUB_SHA::7}. Every build is signed with the same key, so it installs over the previous one."
